name: Sync latest console2svg release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/arika0093/console2svg/releases/latest)

          tag=$(jq -r '.tag_name' <<<"$release")
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"

          checksum() {
            local url=$1 digest=$2
            if [[ "$digest" == sha256:* ]]; then
              printf '%s\n' "${digest#sha256:}"
            else
              curl -fsSL "$url" | sha256sum | awk '{print $1}'
            fi
          }

          emit_asset() {
            local name=$1 prefix=$2 url digest sha
            url=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url // empty' <<<"$release")
            digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")
            test -n "$url"
            sha=$(checksum "$url" "$digest")
            echo "${prefix}_url=$url" >> "$GITHUB_OUTPUT"
            echo "${prefix}_sha=$sha" >> "$GITHUB_OUTPUT"
          }

          emit_asset console2svg-osx-arm64.tar.gz mac_arm
          emit_asset console2svg-osx-x64.tar.gz mac_intel
          emit_asset console2svg-linux-arm64.tar.gz linux_arm
          emit_asset console2svg-linux-x64.tar.gz linux_intel

      - name: Update formula
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MAC_ARM_URL: ${{ steps.release.outputs.mac_arm_url }}
          MAC_ARM_SHA: ${{ steps.release.outputs.mac_arm_sha }}
          MAC_INTEL_URL: ${{ steps.release.outputs.mac_intel_url }}
          MAC_INTEL_SHA: ${{ steps.release.outputs.mac_intel_sha }}
          LINUX_ARM_URL: ${{ steps.release.outputs.linux_arm_url }}
          LINUX_ARM_SHA: ${{ steps.release.outputs.linux_arm_sha }}
          LINUX_INTEL_URL: ${{ steps.release.outputs.linux_intel_url }}
          LINUX_INTEL_SHA: ${{ steps.release.outputs.linux_intel_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/console2svg.rb")
          text = path.read_text()
          text = re.sub(
              r'  version "[^"]+"',
              f'  version "{os.environ["RELEASE_VERSION"]}"',
              text,
              count=1,
          )

          assets = (
              ("osx-arm64", "MAC_ARM_URL", "MAC_ARM_SHA"),
              ("osx-x64", "MAC_INTEL_URL", "MAC_INTEL_SHA"),
              ("linux-arm64", "LINUX_ARM_URL", "LINUX_ARM_SHA"),
              ("linux-x64", "LINUX_INTEL_URL", "LINUX_INTEL_SHA"),
          )
          for suffix, url_key, sha_key in assets:
              pattern = rf'(\s+url ")[^"]*console2svg-{re.escape(suffix)}\.tar\.gz("\n\s+sha256 ")[^"]+("\n)'
              replacement = (
                  rf'\g<1>{os.environ[url_key]}\g<2>{os.environ[sha_key]}\g<3>'
              )
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"failed to update {suffix} formula entry")

          path.write_text(text)
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%d)" == "01" ]]; then
            date -u +%Y-%m > .sync-heartbeat
          fi

          git add Formula/console2svg.rb .sync-heartbeat 2>/dev/null || git add Formula/console2svg.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync console2svg ${{ steps.release.outputs.version }}"
          git push
